# @Author: Jordi Jaspers
#
# =============== BUILD PERFORMANCE =================
# Parallel execution is DISABLED on purpose. Spotless caches its formatter classloader (Eclipse JDT,
# cleanthat) inside the Gradle daemon and closes the backing jars when a build finishes. With modules
# formatting concurrently in a reused daemon, one module closes those jars while another is still
# loading classes from them, which fails a random Spotless step in a random module with
# `ZipException: ZipFile closed` -> `NoClassDefFoundError`. It reproduced on a fresh daemon in a
# deterministic pass/fail/pass/fail pattern and also on Spotless 7.2.1, so it is not a regression of
# the current version. Serialising only the Spotless tasks (shared build service, maxParallelUsages=1)
# was tried and does NOT help: the poisoned classloader is cached across builds, not just within one.
# Cost of disabling parallelism is ~3s on a full build (~41s vs ~38s); a 50% flaky build costs more.
org.gradle.parallel=false
# Local build cache: avoids re-running tasks whose inputs/outputs have not changed.
org.gradle.caching=true
# Heap: default 512m caused OOM during large builds (java_pid*.hprof found in repo root).
# 4g main heap + 1g metaspace covers all 8 modules plus the quality tools.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
