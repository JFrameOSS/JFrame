#
# General project properties
#
# @Author: Jordi Jaspers
#
# =============== BUILD PERFORMANCE =================
# Parallel execution: modules are independent enough for this; no shared mutable state between them.
org.gradle.parallel=true
# Local build cache: avoids re-running tasks whose inputs/outputs have not changed.
org.gradle.caching=true
# Heap: default 512m caused OOM during large parallel builds (java_pid*.hprof found in repo root).
# 4g main heap + 1g metaspace covers all 8 modules compiled in parallel with quality tools.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
