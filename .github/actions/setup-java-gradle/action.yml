name: Setup Java & Gradle
description: Installs the mise-pinned Java toolchain and sets up Gradle with caching.

inputs:
  cache-read-only:
    description: Whether the Gradle cache should be read-only.
    required: true

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      with:
        install: false

    - name: Read Java toolchain
      id: java-version
      shell: bash
      run: |
        raw=$(mise cfg get -f mise.toml tools.java)
        case "$raw" in
          *-*) distribution="${raw%%-*}"; version="${raw#*-}" ;;
          *)   distribution="temurin";    version="$raw"      ;;
        esac
        echo "distribution=$distribution" >> $GITHUB_OUTPUT
        echo "version=$version" >> $GITHUB_OUTPUT
        echo "Java toolchain: $distribution $version"

    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: ${{ steps.java-version.outputs.distribution }}
        java-version: ${{ steps.java-version.outputs.version }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
