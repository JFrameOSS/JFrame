name: Renovate Dependency Updates

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        type: choice
        options: [debug, info]
        default: info
      dryRun:
        description: Dry run (no branches or PRs created)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Prepare Renovate log
        env:
          LOG_PATH: ${{ runner.temp }}/renovate-log.ndjson
        run: |
          touch "$LOG_PATH"
          chmod 666 "$LOG_PATH"

      - name: Enable dry run
        if: inputs.dryRun
        run: echo "RENOVATE_DRY_RUN=full" >> "$GITHUB_ENV"

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: .github/renovate-global.json
          docker-volumes: /tmp:/tmp;${{ runner.temp }}:${{ runner.temp }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_LOG_FILE: ${{ runner.temp }}/renovate-log.ndjson
          RENOVATE_LOG_FILE_LEVEL: debug

      - name: Upload Renovate log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renovate-log
          path: ${{ runner.temp }}/renovate-log.ndjson
          if-no-files-found: ignore
          retention-days: 14
