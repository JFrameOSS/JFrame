name: CI/CD
on:
  push:
    branches: [develop, master, 'release/**', 'hotfix/**']
    tags: ['*.*.*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [develop, master, 'release/**', 'hotfix/**']
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =============================================================================
  # FORMAT - spotless check (fast fail, branches only)
  # =============================================================================
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java & Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          cache-read-only: 'true'

      - name: Check formatting
        run: ./gradlew spotlessCheck -PdisableAutoFormat

  # =============================================================================
  # BUILD - compile main + test sources, deprecation gate (only job writing Gradle cache on push)
  # =============================================================================
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java & Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          echo "=== Starting clean build ==="
          echo "Branch: $BRANCH"
          echo "Commit: ${COMMIT::7}"
          set -o pipefail
          ./gradlew clean assemble testClasses -PdisableAutoFormat --warning-mode all 2>&1 | tee build-output.log
          echo "=== Build completed successfully ==="

      - name: Check for new deprecation warnings
        run: .github/scripts/deprecation-gate.sh build-output.log

      - name: Upload build log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-output
          path: build-output.log
          retention-days: 14

  # =============================================================================
  # TEST - unit tests per module group, results published as checks
  # =============================================================================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            tasks: ':jframe-core:test'
          - group: spring
            tasks: ':jframe-spring-core:test :jframe-spring-jpa:test :jframe-spring-otlp:test'
          - group: quarkus
            tasks: ':jframe-quarkus-core:test :jframe-quarkus-jpa:test :jframe-quarkus-otlp:test :jframe-quarkus-otlp-deployment:test'
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java & Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          cache-read-only: 'true'

      - name: Test
        env:
          TASKS: ${{ matrix.tasks }}
        run: |
          read -r -a tasks <<< "$TASKS"
          ./gradlew "${tasks[@]}" -PdisableAutoFormat

      - name: Publish unit test results
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        if: always()
        with:
          files: '**/build/test-results/**/*.xml'
          check_name: Unit tests (${{ matrix.group }})
          comment_mode: off

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.group }}
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/
          retention-days: 30

  # =============================================================================
  # QUALITY - checkstyle, PMD, SpotBugs, otelVersionGuard (everything in check except tests)
  # =============================================================================
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java & Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          cache-read-only: 'true'

      - name: Static analysis
        run: ./gradlew check -x test -PdisableAutoFormat

      - name: Upload quality reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-reports
          path: |
            **/build/reports/checkstyle/
            **/build/reports/pmd/
            **/build/reports/spotbugs/
            **/build/reports/codenarc/
          retention-days: 14
          if-no-files-found: ignore

  # =============================================================================
  # SBOM - CycloneDX bill of materials
  # =============================================================================
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java & Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          cache-read-only: 'true'

      - name: Generate SBOM
        run: ./gradlew cyclonedxBom -PdisableAutoFormat

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: build/reports/cyclonedx/bom.json
          retention-days: 90

  # =============================================================================
  # PUBLISH DRY RUN - POM, javadoc and sources jars (signing skipped without keys)
  # =============================================================================
  publish-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java & Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          cache-read-only: 'true'

      - name: Publish to Maven local
        run: ./gradlew publishToMavenLocal -PdisableAutoFormat

  # =============================================================================
  # RELEASE - verify tag, full build, publish to Maven Central, GitHub Release (version tags only)
  # =============================================================================
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java & Gradle
        uses: ./.github/actions/setup-java-gradle
        with:
          cache-read-only: 'false'

      - name: Verify version matches tag
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          PROPERTIES_VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)

          echo "=== Version Verification ==="
          echo "Tag version: $TAG_VERSION"
          echo "Properties version: $PROPERTIES_VERSION"

          if [ "$TAG_VERSION" != "$PROPERTIES_VERSION" ]; then
            echo "❌ Error: Tag version ($TAG_VERSION) does not match gradle.properties version ($PROPERTIES_VERSION)"
            exit 1
          fi

          echo "✅ Version verification passed"

      - name: Verify doc versions match tag
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          PATTERN="io\.github\.jframeoss:jframe-[a-z-]*:[0-9]"
          FAILED=false
          for FILE in README.md docs/getting-started.md; do
            while IFS= read -r MATCH; do
              COORD_VERSION="${MATCH##*:}"
              COORD_VERSION="${COORD_VERSION%%[^0-9.]*}"
              if [ "$COORD_VERSION" != "$TAG_VERSION" ]; then
                echo "❌ $FILE: stale coordinate '$MATCH' (expected version $TAG_VERSION)"
                FAILED=true
              fi
            done < <(grep -oP "${PATTERN}[0-9.]*" "$FILE" 2>/dev/null || true)
          done
          if [ "$FAILED" = true ]; then
            exit 1
          fi
          echo "✅ All doc coordinates match tag $TAG_VERSION"

      - name: Build
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          echo "=== Building release $TAG_VERSION ==="
          ./gradlew build cyclonedxBom -PdisableAutoFormat
          echo "=== Build completed successfully ==="

      - name: Publish unit test results
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2.26.0
        if: always()
        with:
          files: '**/build/test-results/**/*.xml'
          check_name: Release unit tests
          comment_mode: off

      - name: Upload Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-test-results
          path: |
            **/build/test-results/test/*.xml
            **/build/reports/tests/test/
          retention-days: 90

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: release-sbom
          path: build/reports/cyclonedx/bom.json
          retention-days: 90

      - name: Publish to Maven Central
        run: |
          echo "=== Publishing to Maven Central via nmcp ==="
          ./gradlew publishAggregationToCentralPortal
          echo "=== Publishing completed successfully ==="
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

      - name: Build Changelog
        id: build_changelog
        uses: requarks/changelog-action@7ce6be4c4d2233ae2a943694ca34f23aeafa1054 # v1.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          writeToFile: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body: ${{ steps.build_changelog.outputs.changes }}
          files: build/reports/cyclonedx/bom.json

  # =============================================================================
  # CI OK - single required check aggregating all jobs (failure/cancelled block, skipped passes)
  # =============================================================================
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [format, build, test, quality, sbom, publish-dry-run, publish]
    permissions: {}

    steps:
      - name: Fail on upstream failure or cancellation
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<< "$RESULTS" > /dev/null; then
            jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | "\(.key): \(.value.result)"' <<< "$RESULTS"
            exit 1
          fi
          echo "All upstream jobs passed or were skipped"
