name: Lint Workflows

on:
  push:
    branches: [develop, master, 'release/**', 'hotfix/**']
    tags: ['*.*.*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [develop, master, 'release/**', 'hotfix/**']
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =============================================================================
  # PATH FILTERS
  # =============================================================================
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci-lint: ${{ steps.filter.outputs.ci-lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ci-lint:
              - '.github/**'
              - '**/gradle/wrapper/**'
              - 'gradlew*'

  # =============================================================================
  # LINT - workflows (actionlint) and Gradle wrapper validation
  # =============================================================================
  lint-ci:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ci-lint == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: true
          install_args: "aqua:rhysd/actionlint aqua:koalaman/shellcheck"

      - name: Lint workflows (actionlint)
        run: actionlint

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
